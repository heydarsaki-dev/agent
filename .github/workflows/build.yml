name: Build Signed APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk: "25"
          build-tools: "35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x agent/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate keystore and signing properties in app module
        run: |
          cd agent/app
          keytool -genkeypair -alias releasekey -keyalg RSA -keysize 2048 -validity 3650 \
            -keystore release.keystore \
            -storepass password -keypass password \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          echo 'storeFile=release.keystore' > signing.properties
          echo 'storePassword=password' >> signing.properties
          echo 'keyAlias=releasekey' >> signing.properties
          echo 'keyPassword=password' >> signing.properties
          # Get absolute path for signing properties
          echo "SIGNING_PROPS_PATH=$(pwd)/signing.properties" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease -PsigningProps=$SIGNING_PROPS_PATH
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: List ALL build outputs
        run: |
          find agent/app/build -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: agent/app/build/outputs/**/*.apk
