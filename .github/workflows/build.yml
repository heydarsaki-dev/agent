name: Build Signed APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          target: google_apis
          ndk: '25.1.8937393'
          build-tools: '35.0.0'
          emulator: true
          sys-img: android-35 google_apis x86_64

      - name: Grant execute permission for gradlew
        run: chmod +x agent/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          cd agent
          echo 'storeFile=release.keystore' > /tmp/signing.properties
          echo 'storePassword=password' >> /tmp/signing.properties
          echo 'keyAlias=releasekey' >> /tmp/signing.properties
          echo 'keyPassword=password' >> /tmp/signing.properties
          
          ./gradlew assembleRelease -PsigningProps=/tmp/signing.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: agent/app/build/outputs/apk/release/app-release.apk
