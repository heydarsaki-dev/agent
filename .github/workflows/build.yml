name: Build Signed APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use built-in Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls -la /usr/local/lib/android/sdk/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate keystore and signing properties
        run: |
          keytool -genkeypair -alias releasekey -keyalg RSA -keysize 2048 -validity 3650 \
            -keystore release.keystore \
            -storepass password -keypass password \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          echo 'storeFile=release.keystore' > signing.properties
          echo 'storePassword=password' >> signing.properties
          echo 'keyAlias=releasekey' >> signing.properties
          echo 'keyPassword=password' >> signing.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease -PsigningProps=signing.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List ALL build outputs
        run: |
          echo "=== ALL files in app/build ==="
          find app/build -type f | sort
          echo "=== ALL APK/AAB files ==="
          find app/build -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
            app/build/**/*.apk
            app/build/**/*.aab
